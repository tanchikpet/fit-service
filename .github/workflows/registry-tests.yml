name: Registry tests
on:
  push:
    paths:
      - 'registry.*'
      - 'fit-requests/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/registry-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # Playwright 1.56 supports Ubuntu 24.04; avoid implicit runner OS upgrades.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: pip install cryptography==46.0.3
      - run: |
          node --check registry.js
          node --check fit-requests/registry-bridge.js
          node --check fit-requests/intake.js
          python -m unittest discover -s tests -p 'test_*.py' -v
      - run: pip install playwright==1.56.0 cryptography==46.0.3
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_registry.py

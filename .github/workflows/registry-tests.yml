name: Registry tests
on:
  push:
    paths:
      - 'registry.*'
      - 'fit-requests/**'
      - 'scripts/registry_monitor.py'
      - 'tests/**'
      - '.github/workflows/registry-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check registry.js
          node --check fit-requests/registry-bridge.js
          node --check fit-requests/intake.js
          python -m unittest discover -s tests -p 'test_*.py' -v
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_registry.py

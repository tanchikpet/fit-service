<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>FIT Requests — заявки на web-разработку</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="shortcut icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./intake.css?v=2"></head>
<body><div class="shell">
<aside class="sidebar"><div class="brand"><div class="brand-symbol">F<span>.</span></div><div><strong>FIT Requests</strong><small>Заявки на web-разработку</small></div></div><nav id="navigation" aria-label="Главное меню"></nav><div class="sidebar-bottom"><div class="demo-tag"><i></i> Демо-режим · локальные данные</div><div class="profile"><div class="avatar">PM</div><div><b>Project Manager</b><small>Рабочий прототип</small></div></div></div></aside>
<div class="main"><header class="topbar"><div class="crumb" id="breadcrumb">Обзор</div><div class="top-actions"><span class="today" id="today"></span><button class="icon-btn" id="resetDemo" title="Сбросить демонстрационные данные">↺</button><div class="avatar mini">PM</div></div></header>
<main id="main" tabindex="-1"></main></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="requestDialog"><form id="requestForm" method="dialog"><div class="modal-head"><div><small>FIT REQUESTS</small><h2 id="dialogTitle">Новая заявка</h2></div><button type="button" class="close" id="closeDialog" aria-label="Закрыть">×</button></div><input type="hidden" id="requestId"><label>Название задачи <span>*</span><input id="requestTitle" required maxlength="150" placeholder="Например, обновить форму записи"></label><div class="form-grid"><label>Проект<select id="requestProject"></select></label><label>Тип заявки<select id="requestType"><option>Доработка</option><option>Новая функциональность</option><option>Исправление ошибки</option><option>Аналитика</option><option>Дизайн</option></select></label><label>Приоритет<select id="requestPriority"><option>Средний</option><option>Высокий</option><option>Критический</option><option>Низкий</option></select></label><label>Статус<select id="requestStatus"><option>Новая</option><option>Уточнение</option><option>Запланирована</option><option>Разработка</option><option>Тестирование</option><option>Демо</option><option>Готово</option></select></label><label>Исполнитель<select id="requestAssignee"><option>Не назначен</option><option>Дмитрий Ершов</option><option>Дмитрий Олейников</option><option>Внутренняя команда</option></select></label><label>Плановая дата<input id="requestDue" type="date"></label></div><label>Описание<textarea id="requestDescription" rows="4" placeholder="Что требуется сделать и какой результат ожидается"></textarea></label><label>Ссылка на карточку Kaiten (необязательно)<input id="requestKaiten" type="url" placeholder="https://rossko.kaiten.ru/..."></label><div class="modal-actions"><button type="button" class="button secondary" id="cancelDialog">Отмена</button><button type="submit" class="button primary">Сохранить заявку</button></div></form></dialog>
<script src="./app.js?v=registry-1" defer></script><script src="./intake.js?v=registry-1" defer></script><script src="./registry-bridge.js?v=1" defer></script><script src="./export-backup.js?v=1" defer></script></body></html>
